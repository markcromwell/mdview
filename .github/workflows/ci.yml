name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reject external runtime script/style refs
        run: |
          if grep -EIn "<(script|link)[^>]+(src|href)[[:space:]]*=[[:space:]]*[\"']https://" index.html render.js app.js fileio.js; then
            echo "External script/style URL found"; exit 1
          fi
          if grep -EIn "(import[[:space:]]+.*[\"']https://|from[[:space:]]+[\"']https://)" render.js app.js fileio.js; then
            echo "External module URL found"; exit 1
          fi
      - name: Reject external URLs in vendored runtime assets
        run: |
          if grep -RIn "https://" vendor assets; then
            echo "External URL string found in vendored runtime assets"; exit 1
          fi
